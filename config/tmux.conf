# List of plugins
set -g @plugin 'tmux-plugins/tpm'

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s extended-keys on
set -as terminal-features '*:extkeys'
set -as terminal-features 'xterm*:RGB:clipboard'
set -s set-clipboard on

unbind C-b
set -g prefix C-j
bind C-j send-prefix

setw -g mode-keys vi
setw -g mouse on

bind-key L clear-history
bind-key C-S-l clear-history
bind-key r refresh-client
bind-key C-r refresh-client
bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."
bind-key C-S-r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

bind-key v split-window -h
bind-key C-v split-window -h
bind-key s split-window -v
bind-key C-s split-window -v
bind-key h select-pane -L
bind-key C-h select-pane -L
bind-key j select-pane -D
bind-key C-j select-pane -D
bind-key k select-pane -U
bind-key C-k select-pane -U
bind-key l select-pane -R
bind-key C-l select-pane -R

set-option -g status-position top

bind-key \; copy-mode
bind-key a paste-buffer
bind-key C-a paste-buffer
bind-key C-] paste-buffer
bind-key 'C-;' copy-mode

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel


# DESIGN TWEAKS
# --- Mocha Color Declaration ---
set -g @mocha_bg "#faf9f5"
set -g @mocha_fg "#3d3d3a"
set -g @mocha_mauve "#c15f3c"
set -g @mocha_sapphire "#c15f3c"
set -g @mocha_peach "#c15f3c"
set -g @mocha_green "#5f7a2e"
set -g @mocha_surface "#efece2"
set -g @mocha_sky "#2e8b8b"

# SLURM pill colors (these vars were referenced but never defined)
set -g @black "#faf9f5"
set -g @white "#5f7a2e"

# --- Mapping @thm variables to @mocha variables ---
set -g @thm_bg "#{@mocha_bg}"
set -g @thm_fg "#{@mocha_fg}"
set -g @thm_surface_0 "#{@mocha_surface}"
set -g @thm_sapphire "#{@mocha_sapphire}"
set -g @thm_lavender "#{@mocha_mauve}"
set -g @thm_green "#{@mocha_green}"


# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour "#c15f3c"

# copy mode
setw -g mode-style 'fg=#3d3d3a bg=#e7d6cc bold'

# panes
set -g pane-border-style 'fg=#d8d2c4'
set -g pane-active-border-style 'fg=#c15f3c'

# --- Status Bar General ---
set -g status-position top
set -g status-justify left
set -g status-interval 10
set -g status-style "bg=#{@thm_surface_0},fg=#{@thm_fg}"

# --- Right Side: Multi-Color Pills ---
set -g status-right-length 100
set -g status-right "" # Clear the default

# 1. Slurm Pill (Lavender)
set -ag status-right "#[fg=#{@mocha_fg},bg=#{@black}]#[fg=#{@mocha_fg},bg=#{@mocha_bg}]#[fg=#{@white}] SLURM#[fg=#{@white},bg=#{white},bold] #(~/.local/bin/tmux-slurm) #[fg=#{@mocha_fg},bg=#{@mocha_bg}]"

# Add a small transparent spacer between pills
#set -ag status-right " "

# 2. Time Pill (Sapphire)
set -ag status-right "#[fg=#{@thm_sapphire},bg=#{@thm_lavender}]#[fg=#{@thm_bg},bg=#{@thm_lavender}] %Y-%m-%d %H:%M %Z#[fg=#{@thm_sapphire},bg=#{@thm_lavender}]"

# Padding for the far right edge
set -ag status-right " "

set -g status-left ""
#set -g status-left-length 100
#set -g status-left "#[fg=#{@thm_green},bg=#{@thm_bg}]#[fg=#{@thm_bg},bg=#{@thm_green},bold]#S#[fg=#{@thm_green},bg=#{@thm_bg}]"

# 3. window status bar
set -g window-status-separator ""
setw -g window-status-current-style 'fg=#faf9f5 bg=#c15f3c bold'
setw -g window-status-current-format ' #[bold]#I #[bold]#W #F '

setw -g window-status-style 'fg=#8a8a85 bg=#efece2'
setw -g window-status-format ' #I #[fg=#6b6b66]#W #[fg=#c15f3c]#F '

setw -g window-status-bell-style 'fg=#faf9f5 bg=#b83d2e bold'


# messages
set -g message-style 'fg=#faf9f5 bg=#c15f3c bold'


# TPM is optional. A config reload must still succeed on a fresh cluster before
# plugins have been installed.
if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' \
  'run-shell "$HOME/.tmux/plugins/tpm/tpm"'
