##### TPM plugins #####
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
#set -g @plugin 'tmux-plugins/tmux-yank'        # portable clipboard & OSC52 fallback

# Initialize TMUX plugin manager (keep at the end)

##### Prefix & basics #####
unbind C-b
set -g prefix C-j
bind C-j send-prefix

set -g mouse on
setw -g mode-keys vi

bind-key R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."
bind-key L clear-history
bind-key r refresh-client

# splits & pane nav
bind-key v split-window -h
bind-key s split-window -v
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# copy mode
bind-key [ copy-mode
bind-key ] paste-buffer
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

#set -s set-clipboard on

# move x clipboard into tmux paste buffer
bind C-p run "tmux set-buffer \"$(xclip -o)\"; tmux paste-buffer"
# move tmux copy buffer into x clipboard
bind C-y run "tmux show-buffer | xclip -i"

##### Noise settings #####
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

##### Term & colors (portable truecolor) #####
set -g default-terminal "screen-256color"
# truecolor support if terminal advertises Tc (Ghostty does)
set -ga terminal-overrides ",xterm-256color:Tc,screen-256color:Tc,tmux-256color:Tc,xterm-ghostty:Tc"

# ============================================================
# Claude light theme  —  cream (#faf9f5) + clay (#c15f3c)
# Palette:
#   bg      #faf9f5   surface  #efece2   surface2 #e4dfd2
#   ink     #3d3d3a   muted    #8a8a85   border   #d8d2c4
#   clay    #c15f3c   clay-br  #d97757
# ============================================================

##### Status bar #####
set -g status-justify left
set -g status-interval 2
set -g status-position top
set -g status-left-length 30
set -g status-right-length 60

# Baseline status line: ink text on a soft cream band
set -g status-style "fg=#3d3d3a,bg=#efece2"

# Left: session name in a clay chip
set -g status-left "#[fg=#faf9f5,bg=#c15f3c,bold] #S #[fg=#c15f3c,bg=#efece2,nobold] "

# Right: date + time chips
set -g status-right "#[fg=#6b6b66,bg=#efece2] %a %d %b #[fg=#d8d2c4]│#[fg=#3d3d3a,bg=#e4dfd2,bold] %H:%M:%S "

# Inactive windows: muted ink on cream
setw -g window-status-style "fg=#8a8a85,bg=#efece2"
setw -g window-status-format " #I:#W#F "

# Active window: clay accent
setw -g window-status-current-style "fg=#faf9f5,bg=#c15f3c,bold"
setw -g window-status-current-format " #I:#W#F "

# Bell / activity window
setw -g window-status-bell-style "fg=#faf9f5,bg=#b83d2e,bold"

##### Panes #####
set -g pane-border-style "fg=#d8d2c4"
set -g pane-active-border-style "fg=#c15f3c"
set -g display-panes-colour "#8a8a85"
set -g display-panes-active-colour "#c15f3c"

##### Messages & command prompt #####
set -g message-style "fg=#faf9f5,bg=#c15f3c,bold"
set -g message-command-style "fg=#3d3d3a,bg=#e4dfd2"

##### Copy / search mode selection #####
setw -g mode-style "fg=#3d3d3a,bg=#e7d6cc"

##### Clock #####
setw -g clock-mode-colour "#c15f3c"

##### Activity / titles #####
setw -g automatic-rename on
set -g set-titles on

##### TPM bootstrap #####
# If TPM is missing, clone it (useful on fresh clusters).
if-shell '[ ! -d ~/.tmux/plugins/tpm ]' \
  'run -b "git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm"'

# Load TPM (keep at the very end)
run '~/.tmux/plugins/tpm/tpm'
